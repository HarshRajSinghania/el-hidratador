site_name: El Hidratador
site_description: Context expansion and execution staging engine for the local-first AI software factory.
site_url: https://hamanakam1.github.io/el-hidratador/
repo_url: https://github.com/hamanakam1/el-hidratador
repo_name: hamanakam1/el-hidratador
edit_uri: edit/main/docs/
copyright: "MIT licensed. Author: Michael Hamanaka."

docs_dir: docs
site_dir: site

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.code.annotate
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Architecture: architecture.md
  - CLI reference: cli-reference.md
  - Context and packets: context-and-packets.md
  - DAG and sandbox: dag-and-sandbox.md
  - GitHub sync: github-sync.md
  - Failure playbook: failure-playbook.md
  - Operations: operations.md
  - Security: security.md
  - Roadmap: roadmap.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/hamanakam1/el-hidratador
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/el-hidratador/

extra_css:
  - stylesheets/extra.css
