name: Question
description: Ask how to use el-hidratador.
title: "[Question]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for usage questions. For defects use the bug report, and
        for proposals use the feature request.

  - type: textarea
    id: question
    attributes:
      label: Question
      description: What you are trying to do, and what you are unsure about.
    validations:
      required: true

  - type: textarea
    id: attempted
    attributes:
      label: What you have already tried
      description: The commands you ran and the output you got.
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15.3, Ubuntu 24.04
    validations:
      required: false

  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: 3.12.4
    validations:
      required: false

  - type: input
    id: tool-version
    attributes:
      label: el-hidratador version
      placeholder: 0.1.0
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched the existing issues and discussions for this question.
          required: true
        - label: I did not include credentials, secrets, or private ticket data in this question.
          required: true
