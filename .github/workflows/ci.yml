name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege by default. Individual jobs widen this only where they need to.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and dev dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Smoke test the CLI
        run: |
          set -euo pipefail
          ledger_dir="$(mktemp -d)"
          hidratador --help
          hidratador --db "${ledger_dir}/ledger.sqlite" init
          test -f "${ledger_dir}/ledger.sqlite"

  quality:
    name: quality (lint, format, types)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and dev dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check el_hidratador/

      - name: Check formatting
        run: ruff format --check el_hidratador/

      - name: Type check
        run: mypy el_hidratador/

  coverage:
    name: coverage (ubuntu, py3.12)
    needs: test
    # Restricted to a single combination on purpose: the coverage report is a
    # signal, not a gate, and one platform is enough to read it.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and dev dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install coverage

      - name: Run tests under coverage
        run: coverage run --source=el_hidratador -m unittest discover -s tests -v

      - name: Report coverage
        run: |
          set -euo pipefail
          coverage report --show-missing | tee coverage.txt
          {
            echo "## Coverage"
            echo
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            coverage.txt
            .coverage
          if-no-files-found: error
          retention-days: 14

  smoke:
    name: smoke (built wheel)
    needs: test
    # Ubuntu only: the wheel smoke test does not need to run on every platform.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tooling
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build the distribution
        run: python -m build --sdist --wheel --outdir dist/

      - name: Install the built wheel in a fresh environment
        run: |
          set -euo pipefail
          python -m venv .wheel-venv
          .wheel-venv/bin/python -m pip install --upgrade pip
          .wheel-venv/bin/python -m pip install dist/*.whl

      - name: Run the packaged CLI
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/wheel-smoke"
          ledger_path="${RUNNER_TEMP}/wheel-smoke/ledger.sqlite"
          .wheel-venv/bin/hidratador --help
          .wheel-venv/bin/hidratador --db "${ledger_path}" init
          .wheel-venv/bin/hidratador --db "${ledger_path}" status
