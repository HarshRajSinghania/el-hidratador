name: Super Linter

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: super-linter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: super-linter
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DEFAULT_BRANCH: main
      LOG_LEVEL: NOTICE
      # Only the files that changed in this run are linted.
      VALIDATE_ALL_CODEBASE: false

      # Linters that are relevant to this repository.
      VALIDATE_MARKDOWN: true
      VALIDATE_YAML: true
      VALIDATE_JSON: true
      VALIDATE_EDITORCONFIG: true
      # Shellcheck runs as part of the Bash linter.
      VALIDATE_BASH: true
      # Ruff is the linter configured for this project; pylint, black, isort,
      # flake8 and mypy are switched off so the project tooling stays the
      # single source of truth.
      VALIDATE_PYTHON: false
      VALIDATE_PYTHON_PYLINT: false
      VALIDATE_PYTHON_BLACK: false
      VALIDATE_PYTHON_ISORT: false
      VALIDATE_PYTHON_FLAKE8: false
      VALIDATE_PYTHON_MYPY: false
      VALIDATE_PYTHON_RUFF: true
      VALIDATE_PYTHON_RUFF_FORMAT: false

      # Formatters and checkers that would duplicate or contradict the
      # project configuration.
      VALIDATE_MARKDOWN_PRETTIER: false
      VALIDATE_YAML_PRETTIER: false
      VALIDATE_JSON_PRETTIER: false
      VALIDATE_JSONC: false
      VALIDATE_JSONC_PRETTIER: false
      VALIDATE_SPELL_CODESPELL: false
      VALIDATE_NATURAL_LANGUAGE: false
      VALIDATE_PRE_COMMIT: false
      VALIDATE_JSCPD: false

      # Workflow and repository hygiene checks.
      VALIDATE_GITHUB_ACTIONS: true
      VALIDATE_GITLEAKS: true
      # Renovate is not installed on this repository: Dependabot is the single
      # dependency updater, so a second runner would open duplicate pull requests.
      VALIDATE_RENOVATE: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Super Linter
        uses: super-linter/super-linter@2da136927bd4a73596db63044b504547c62cb854 # v9.0.0
        env:
          # Super Linter v9 requires an explicit token to publish status
          # reports and pull request summaries.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
