name: Labeler

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, unlabeled]
  issues:
    types: [opened, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: labeler-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  label:
    name: apply labels
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # `pull_request_target` runs with the base repository context. The pull
      # request head is never checked out here, so no untrusted code from the
      # pull request is executed by this workflow.
      - name: Apply area labels from the path mapping
        if: github.event_name == 'pull_request_target'
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true
          dot: true

      # The area labels above come from file globs. The size label is computed
      # from the diff itself, then the size labels are normalised so exactly
      # one of size/S, size/M, size/L is set.
      - name: Apply the size label
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          changed_lines="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
            --paginate \
            --jq '.[] | "\(.additions) \(.deletions)"' \
            | awk '{ added += $1; removed += $2 } END { printf "%d", added + removed }')"
          if [ "${changed_lines}" -le 100 ]; then
            size="size/S"
          elif [ "${changed_lines}" -le 400 ]; then
            size="size/M"
          else
            size="size/L"
          fi
          for candidate in "size%2FS" "size%2FM" "size%2FL"; do
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels/${candidate}" \
              >/dev/null 2>&1 || true
          done
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" -f "labels[]=${size}"
          echo "Applied ${size}: ${changed_lines} changed lines."

      - name: Send new issues to triage
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/labels" -f "labels[]=needs-triage"
