name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish a release for (for example v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  # A release is not cancelled: the tag is already pushed and the artifacts
  # must be produced for it.
  cancel-in-progress: false

jobs:
  release:
    name: build and publish the release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Resolve the release tag
        id: resolve
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG}" ]; then
            tag="${INPUT_TAG}"
          else
            tag="${REF#refs/tags/}"
          fi
          if [ -z "${tag}" ]; then
            echo "no release tag could be resolved" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.resolve.outputs.tag }}
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tooling
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build the distribution
        run: python -m build --sdist --wheel --outdir dist/

      - name: Verify the built wheel installs and runs
        run: |
          set -euo pipefail
          python -m venv .release-venv
          .release-venv/bin/python -m pip install --upgrade pip
          .release-venv/bin/python -m pip install dist/*.whl
          mkdir -p "${RUNNER_TEMP}/release-smoke"
          .release-venv/bin/hidratador --help
          .release-venv/bin/hidratador --db "${RUNNER_TEMP}/release-smoke/ledger.sqlite" init

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          (cd dist && sha256sum -- *.whl *.tar.gz > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --title "${TAG}" \
            ./dist/*.whl \
            ./dist/*.tar.gz \
            ./dist/SHA256SUMS

      - name: Write the release summary
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          {
            echo "## Release ${TAG}"
            echo
            echo "Published to ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
            echo
            echo "| Asset | SHA256 |"
            echo "| --- | --- |"
            while read -r sum file; do
              echo "| \`${file}\` | \`${sum}\` |"
            done < dist/SHA256SUMS
            echo
            echo "The release notes were generated by GitHub from the commit history."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the release artifacts to the run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ steps.resolve.outputs.tag }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
